name: CI

# Run Whoof's tests on every push to main and every PR, so regressions are
# caught before a release tag is cut.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Tool unit tests
        run: ./gradlew :tool:testDebugUnitTest
