kotlin.code.style=official
android.useAndroidX=true
org.gradle.jvmargs=-Xmx4g

sdkGroup=com.thelightphone
sdkVersion=0.2.3

# Local Whoof SDK change (default false upstream): LightOS rejects sideloaded tools at the SDK
# service ("caller not verified"), so LightQrCodeScanner asks Android for CAMERA directly in
# every build type, including release.
lightSdk.directCameraPermission=true
